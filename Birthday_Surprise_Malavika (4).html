<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Happy Birthday Malavika Bubu</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
  .slide { display: none; width: 100vw; height: 100vh; position: relative; }
  .slide.active { display: block; }
  iframe { width: 100%; height: 100%; border: none; display: block; }

  /* ===== Countdown Slide ===== */
  #countdownSlide {
    background: linear-gradient(135deg, #ff9a9e, #fecfef, #fbc2eb);
    color: #4a1942; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    width: 100%; height: 100%; position: relative; overflow: hidden;
  }
  #countdownSlide h1 { font-size: 2.4rem; margin: 0 0 6px 0; z-index: 2; }
  #countdownSlide h2 { font-size: 1.3rem; font-weight: 400; margin: 0 0 30px 0; opacity: 0.85; z-index: 2; }
  #timer { display: flex; gap: 18px; margin-bottom: 36px; z-index: 2; }
  .timeBox {
    background: rgba(255,255,255,0.55); border-radius: 16px;
    padding: 18px 20px; min-width: 80px; box-shadow: 0 4px 14px rgba(0,0,0,0.12);
  }
  .timeBox .num { font-size: 2.2rem; font-weight: 700; display: block; }
  .timeBox .lbl { font-size: 0.8rem; letter-spacing: 1px; text-transform: uppercase; }
  #openBtn {
    padding: 16px 36px; font-size: 17px; font-weight: 600;
    background: linear-gradient(135deg, #ff6b9d, #c44dff); color: #fff;
    border: none; border-radius: 30px; cursor: pointer; z-index: 2;
    box-shadow: 0 4px 18px rgba(0,0,0,0.25); transition: transform 0.2s ease;
  }
  #openBtn:hover { transform: scale(1.06); }
  .floatHeart {
    position: absolute; bottom: -40px; font-size: 22px; opacity: 0.75;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0% { transform: translateY(0) rotate(0deg); opacity: 0.9; }
    100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
  }

  #nextBtn {
    position: fixed; bottom: 22px; right: 22px; z-index: 99999;
    padding: 14px 30px; font-size: 16px; font-weight: 600;
    background: linear-gradient(135deg, #ff6b9d, #c44dff); color: #fff;
    border: none; border-radius: 30px; cursor: pointer;
    box-shadow: 0 4px 18px rgba(0,0,0,0.35);
  }

  /* ===== 3D Chemistry End Screen ===== */
  #endScreen {
    display: none; width: 100vw; height: 100vh; position: relative;
    background: radial-gradient(ellipse at center, #1b0e2b 0%, #0a0416 70%, #000000 100%);
    color: #fff; align-items: center; justify-content: center;
    flex-direction: column; text-align: center; overflow: hidden;
    perspective: 1000px;
  }
  #chem3d { position: absolute; inset: 0; transform-style: preserve-3d; }
  .atom {
    position: absolute; transform-style: preserve-3d;
    animation: atomFloat 8s ease-in-out infinite, atomSpin 10s linear infinite;
  }
  .nucleus {
    position: absolute; top: 50%; left: 50%;
    width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #ffe082, #ff6b9d 70%, #c44dff);
    box-shadow: 0 0 14px 4px rgba(255,107,157,0.8);
  }
  .orbit {
    position: absolute; top: 50%; left: 50%;
    border: 1.5px solid rgba(255,255,255,0.35);
    border-radius: 50%; transform-style: preserve-3d;
  }
  .orbit span {
    position: absolute; top: -4px; left: 50%; margin-left: -4px;
    width: 8px; height: 8px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fff, #66e0ff);
    box-shadow: 0 0 8px 2px rgba(102,224,255,0.9);
  }
  @keyframes atomSpin {
    from { transform: rotateY(0deg) rotateX(15deg); }
    to   { transform: rotateY(360deg) rotateX(15deg); }
  }
  @keyframes atomFloat {
    0%, 100% { margin-top: 0px; }
    50% { margin-top: -25px; }
  }
  .bubble {
    position: absolute; bottom: -60px; border-radius: 50%;
    background: rgba(196,77,255,0.25); border: 1px solid rgba(255,255,255,0.3);
    animation: bubbleUp linear infinite;
  }
  @keyframes bubbleUp {
    0% { transform: translateY(0) scale(1); opacity: 0.8; }
    100% { transform: translateY(-115vh) scale(1.3); opacity: 0; }
  }
  .formula {
    position: absolute; bottom: -40px; font-size: 15px; font-weight: 600;
    color: rgba(255,255,255,0.55); letter-spacing: 1px;
    animation: bubbleUp linear infinite;
  }
  #endScreen .content { position: relative; z-index: 5; }
  #endScreen h1 {
    font-size: 2.8rem; margin-bottom: 12px;
    background: linear-gradient(90deg, #ff6b9d, #66e0ff, #c44dff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 30px rgba(196,77,255,0.4);
    animation: glow 3s ease-in-out infinite;
  }
  @keyframes glow {
    0%, 100% { filter: brightness(1); }
    50% { filter: brightness(1.35); }
  }
  #endScreen p { font-size: 1.2rem; opacity: 0.9; margin: 4px 0; }
  #endScreen .tagline { font-size: 1rem; opacity: 0.7; margin-top: 10px; }

  /* Confetti burst */
  .confetti {
    position: absolute; top: -20px; width: 8px; height: 14px;
    animation: confettiFall linear forwards;
    transform-style: preserve-3d;
  }
  @keyframes confettiFall {
    0%   { transform: translateY(0) rotate3d(1,1,0,0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate3d(1,1,0,720deg); opacity: 0; }
  }

  /* Hero molecule (bigger, center-back, extra surprise) */
  .heroMolecule {
    position: absolute; top: 50%; left: 50%; transform-style: preserve-3d;
    animation: heroSpin 14s linear infinite;
    z-index: 1;
  }
  @keyframes heroSpin {
    from { transform: translate(-50%,-50%) rotateY(0deg) rotateX(20deg); }
    to   { transform: translate(-50%,-50%) rotateY(360deg) rotateX(20deg); }
  }
  .heroNode {
    position: absolute; border-radius: 50%;
    box-shadow: 0 0 20px 6px currentColor;
  }
  .heroBond {
    position: absolute; height: 2px; background: rgba(255,255,255,0.35);
    transform-origin: left center;
  }
</style>
</head>

      document.getElementById("hours").textContent = "00";
      document.getElementById("mins").textContent = "00";
      document.getElementById("secs").textContent = "00";
      document.getElementById("subtext").textContent = "It's here! 🎉";
      clearInterval(countdownInterval);
      return;
    }
    const d = Math.floor(diff / (1000 * 60 * 60 * 24));
    const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    const s = Math.floor((diff % (1000 * 60)) / 1000);
    document.getElementById("days").textContent = String(d).padStart(2, "0");
    document.getElementById("hours").textContent = String(h).padStart(2, "0");
    document.getElementById("mins").textContent = String(m).padStart(2, "0");
    document.getElementById("secs").textContent = String(s).padStart(2, "0");
  }
  updateCountdown();
  const countdownInterval = setInterval(updateCountdown, 1000);

  // ---- 3D Chemistry background for end screen ----
  function buildChem3D() {
    const container = document.getElementById("chem3d");
    if (container.dataset.built) return;
    container.dataset.built = "1";

    // Floating 3D atoms
    const atomCount = 6;
    for (let i = 0; i < atomCount; i++) {
      const size = 70 + Math.random() * 90;
      const atom = document.createElement("div");
      atom.className = "atom";
      atom.style.left = (5 + Math.random() * 85) + "%";
      atom.style.top = (5 + Math.random() * 80) + "%";
      atom.style.width = size + "px";
      atom.style.height = size + "px";
      atom.style.animationDuration = (6 + Math.random() * 5) + "s, " + (8 + Math.random() * 10) + "s";
      atom.style.opacity = 0.55 + Math.random() * 0.4;

      const nucleus = document.createElement("div");
      nucleus.className = "nucleus";
      atom.appendChild(nucleus);

      const ringCount = 2 + Math.floor(Math.random() * 2);
      for (let r = 0; r < ringCount; r++) {
        const orbit = document.createElement("div");
        orbit.className = "orbit";
        orbit.style.width = size + "px";
        orbit.style.height = size + "px";
        orbit.style.marginLeft = (-size / 2) + "px";
        orbit.style.marginTop = (-size / 2) + "px";
        orbit.style.transform = "rotateX(" + (60 + r * 25) + "deg) rotateZ(" + (r * 60) + "deg)";
        orbit.style.animation = "atomSpin " + (4 + r * 2) + "s linear infinite";
        const electron = document.createElement("span");
        orbit.appendChild(electron);
        atom.appendChild(orbit);
      }
      container.appendChild(atom);
    }

    // Rising bubbles (like a chemistry flask)
    for (let i = 0; i < 20; i++) {
      const b = document.createElement("div");
      b.className = "bubble";
      const size = 8 + Math.random() * 22;
      b.style.width = size + "px";
      b.style.height = size + "px";
      b.style.left = Math.random() * 100 + "%";
      b.style.animationDuration = (5 + Math.random() * 7) + "s";
      b.style.animationDelay = (Math.random() * 6) + "s";
      container.appendChild(b);
    }

    // Drifting chemical formulas
    const formulas = ["H₂O", "CO₂", "NaCl", "C₆H₁₂O₆", "O₂", "NH₃", "CH₄"];
    for (let i = 0; i < 10; i++) {
      const f = document.createElement("div");
      f.className = "formula";
      f.textContent = formulas[i % formulas.length];
      f.style.left = Math.random() * 100 + "%";
      f.style.animationDuration = (7 + Math.random() * 8) + "s";
      f.style.animationDelay = (Math.random() * 6) + "s";
      container.appendChild(f);
    }

    // EXTRA SURPRISE #1: confetti burst
    const confettiColors = ["#ff6b9d", "#66e0ff", "#c44dff", "#ffe082", "#7CFFB2"];
    for (let i = 0; i < 45; i++) {
      const c = document.createElement("div");
      c.className = "confetti";
      c.style.left = Math.random() * 100 + "%";
      c.style.background = confettiColors[i % confettiColors.length];
      c.style.animationDuration = (2.5 + Math.random() * 2.5) + "s";
      c.style.animationDelay = (Math.random() * 1.2) + "s";
      c.style.width = (6 + Math.random() * 5) + "px";
      c.style.height = (10 + Math.random() * 8) + "px";
      container.appendChild(c);
    }

    // EXTRA SURPRISE #2: big glowing hero molecule chain, centered behind the text
    const hero = document.createElement("div");
    hero.className = "heroMolecule";
    const nodeColors = ["#ff6b9d", "#66e0ff", "#c44dff", "#ffe082", "#7CFFB2"];
    const nodeCount = 6;
    const radius = 90;
    const nodePositions = [];
    for (let i = 0; i < nodeCount; i++) {
      const angle = (i / nodeCount) * Math.PI * 2;
      const x = Math.cos(angle) * radius;
      const y = Math.sin(angle) * radius * 0.6;
      const z = Math.sin(angle * 2) * 40;
      nodePositions.push({ x, y, z });
      const node = document.createElement("div");
      node.className = "heroNode";
      const size = 16 + (i % 3) * 6;
      node.style.width = size + "px";
      node.style.height = size + "px";
      node.style.left = x + "px";
      node.style.top = y + "px";
      node.style.color = nodeColors[i % nodeColors.length];
      node.style.background = "radial-gradient(circle at 35% 35%, #fff, " + nodeColors[i % nodeColors.length] + ")";
      node.style.transform = "translateZ(" + z + "px)";
      hero.appendChild(node);
    }
    // bonds connecting each node to the next (simple ring)
    for (let i = 0; i < nodeCount; i++) {
      const a = nodePositions[i];
      const b = nodePositions[(i + 1) % nodeCount];
      const dx = b.x - a.x, dy = b.y - a.y;
      const len = Math.sqrt(dx * dx + dy * dy);
      const angleDeg = Math.atan2(dy, dx) * 180 / Math.PI;
      const bond = document.createElement("div");
      bond.className = "heroBond";
      bond.style.width = len + "px";
      bond.style.left = a.x + "px";
      bond.style.top = a.y + "px";
      bond.style.transform = "translateZ(" + a.z + "px) rotate(" + angleDeg + "deg)";
      hero.appendChild(bond);
    }
    container.appendChild(hero);
  }

  let current = 0;
  const total = 3;

  function nextSlide() {
    document.getElementById("slide" + current).classList.remove("active");
    current++;
    if (current === 1) {
      document.getElementById("nextBtn").style.display = "block";
    }
    if (current < total) {
      document.getElementById("slide" + current).classList.add("active");
    } else {
      document.getElementById("nextBtn").style.display = "none";
      document.getElementById("endScreen").style.display = "flex";
      buildChem3D();
    }
  }
</script>
</body>
